<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BanglaMind AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #202938;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 260px;
    background: #ffffff;
    border-right: 1px solid #e8ebf1;
    padding: 22px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 35px;
}

.logo span {
    color: #202938;
}

.new-chat {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

.sidebar-info {
    margin-top: auto;
    color: #8b95a5;
    font-size: 12px;
    line-height: 1.8;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e8ebf1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.header h3 {
    font-size: 17px;
}

.status {
    font-size: 12px;
    color: #16a34a;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.messages {
    max-width: 800px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.welcome {
    text-align: center;
    margin: 80px auto 25px;
}

.welcome-icon {
    width: 65px;
    height: 65px;
    background: #e9efff;
    border-radius: 20px;
    display: grid;
    place-items: center;
    font-size: 30px;
    margin: 0 auto 20px;
}

.welcome h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.welcome p {
    color: #8993a3;
    font-size: 14px;
}

.message {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    min-width: 35px;
    height: 35px;
    border-radius: 12px;
    background: #e8efff;
    display: grid;
    place-items: center;
    font-size: 16px;
}

.bubble {
    max-width: 75%;
    padding: 13px 16px;
    border-radius: 13px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bubble pre {
    background: #1e293b;
    color: #f8fafc;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 10px;
    font-family: monospace;
}

.ai .bubble {
    background: white;
    border: 1px solid #e8ebf1;
}

.user .bubble {
    background: #2563eb;
    color: white;
}

.typing {
    color: #8b95a5;
    font-size: 13px;
    padding-left: 48px;
}

.input-area {
    padding: 15px 20px 20px;
    background: #f5f7fb;
}

.input-container {
    max-width: 800px;
    margin: auto;
    display: flex;
    gap: 10px;
    background: white;
    border: 1px solid #dfe4ed;
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 5px 20px #00000008;
    align-items: center;
}

.input-container input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    padding: 12px;
    font-size: 14px;
    background: transparent;
    min-width: 0;
}

.upload-btn {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    background: #f1f5f9;
    color: #475569;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: 0.2s;
}

.upload-btn:hover {
    background: #e2e8f0;
    color: #2563eb;
}

.send-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 11px;
    background: #2563eb;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.footer-text {
    text-align: center;
    color: #a0a8b5;
    font-size: 11px;
    margin-top: 12px;
}

.history-heading {
    margin-top: 28px;
    margin-bottom: 12px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #929baa;
}

.chat-history {
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    max-height: 55vh;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
    color: #596579;
    font-size: 13px;
}

.history-item:hover {
    background: #f0f3f9;
}

.history-item.active {
    background: #e9efff;
    color: #2563eb;
}

.history-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-actions {
    display: flex;
    gap: 3px;
}

.history-actions button {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 4px;
    color: #8791a1;
}

.history-actions button:hover {
    color: #2563eb;
}

.history-empty {
    color: #a0a8b5;
    font-size: 12px;
    padding: 10px 0;
}
</style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo">
            Bangla<span>Mind</span> AI
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <button class="new-chat" onclick="teachAI()" style="margin-top:10px; background:#16a34a;">
            🧠 Teach AI
        </button>

        <div class="history-heading">RECENT CHATS</div>
        <div id="chatHistory" class="chat-history">
            <p class="history-empty">No conversations yet</p>
        </div>

        <div class="sidebar-info">
            <b>BanglaMind AI</b><br>
            Gemini API Powered<br>
            Online Cloud System
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <h3>AI Expert Assistant</h3>
            <div class="status">● Gemini Connected</div>
        </header>

        <section class="chat-box" id="chatBox">
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🤖</div>
                    <h1>Welcome to BanglaMind AI</h1>
                    <p>Ask me to write code, design websites, or chat normally.</p>
                </div>
            </div>
        </section>

        <footer class="input-area">
            <div id="filePreviewContainer" style="max-width: 800px; margin: 0 auto 8px auto; display: none; align-items: center; gap: 10px; background: #e9efff; padding: 6px 12px; border-radius: 8px; font-size: 13px;">
                <span id="fileNameDisplay" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #2563eb;"></span>
                <button onclick="removeAttachedFiles()" style="border: none; background: transparent; color: #ef4444; cursor: pointer; font-weight: bold;">✕ Remove</button>
            </div>

            <div class="input-container">
                <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFileSelect(event)">
                
                <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Upload Multiple Files or Photos">
                    +
                </button>

                <input type="text" id="userInput" placeholder="Message BanglaMind AI or ask about your files..." autocomplete="off">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
            </div>
            <div class="footer-text">BanglaMind AI Gemini Expert System</div>
        </footer>
    </main>
</div>

<script>
const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const chatBox = document.getElementById("chatBox");
const sendBtn = document.getElementById("sendBtn");

let activeChatId = null;
let sendingMessage = false;
let attachedFiles = [];

function handleFileSelect(event) {
    const files = event.target.files;
    if (!files.length) return;

    attachedFiles = Array.from(files);
    const previewContainer = document.getElementById("filePreviewContainer");
    const fileNameDisplay = document.getElementById("fileNameDisplay");

    const fileNames = attachedFiles.map(f => f.name).join(", ");
    fileNameDisplay.textContent = `Attached (${attachedFiles.length} files): ${fileNames}`;
    previewContainer.style.display = "flex";
}

function removeAttachedFiles() {
    attachedFiles = [];
    document.getElementById("fileInput").value = "";
    document.getElementById("filePreviewContainer").style.display = "none";
}

function addMessage(text, sender) {
    const message = document.createElement("div");
    message.className = "message " + sender;

    if (sender === "ai") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🤖";
        message.appendChild(avatar);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (sender === "ai" && text.includes("```")) {
        let formatted = text.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        bubble.innerHTML = formatted;
    } else {
        bubble.textContent = text;
    }

    message.appendChild(bubble);
    messages.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function showWelcome() {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";

    const icon = document.createElement("div");
    icon.className = "welcome-icon";
    icon.textContent = "🤖";

    const heading = document.createElement("h1");
    heading.textContent = "Welcome to BanglaMind AI";

    const description = document.createElement("p");
    description.textContent = "Ask me to write code, design websites, or chat normally.";

    welcome.append(icon, heading, description);
    messages.appendChild(welcome);
}

async function sendMessage() {
    const text = input.value.trim();
    if ((!text && attachedFiles.length === 0) || sendingMessage) return;

    sendingMessage = true;
    sendBtn.disabled = true;
    let typing = null;

    try {
        if (!activeChatId) {
            const createResponse = await fetch("/chats", {
                method: "POST",
                headers: { "Accept": "application/json" }
            });
            const created = await createResponse.json();
            activeChatId = created.chat.id;
        }

        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();

        let displayMsg = text;
        if (attachedFiles.length > 0) {
            const names = attachedFiles.map(f => f.name).join(", ");
            displayMsg += ` [Attached Files: ${names}]`;
        }
        addMessage(displayMsg, "user");
        
        input.value = "";
        const currentFiles = [...attachedFiles];
        removeAttachedFiles();

        typing = document.createElement("div");
        typing.className = "typing";
        typing.textContent = "Gemini is thinking/analyzing files...";
        messages.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append("message", text || "Analysing the attached files.");
        
        currentFiles.forEach(file => {
            formData.append("files", file);
        });

        const response = await fetch("/chats/" + encodeURIComponent(activeChatId) + "/message", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        if (typing) typing.remove();
        addMessage(data.reply || "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।", "ai");
        await loadChatHistory();

    } catch (error) {
        if (typing) typing.remove();
        addMessage("দুঃখিত! " + error.message, "ai");
    } finally {
        sendingMessage = false;
        sendBtn.disabled = false;
        input.focus();
    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

async function newChat() {
    activeChatId = null;
    messages.innerHTML = "";
    showWelcome();
    await loadChatHistory();
    input.focus();
}

async function loadChatHistory() {
    const history = document.getElementById("chatHistory");
    if (!history) return;

    try {
        const response = await fetch("/chats");
        const chats = await response.json();
        history.innerHTML = "";
        if (!chats.length) {
            history.innerHTML = '<p class="history-empty">No conversations yet</p>';
            return;
        }

        chats.forEach(chat => {
            const item = document.createElement("div");
            item.className = "history-item";
            if (chat.id === activeChatId) item.classList.add("active");

            const title = document.createElement("span");
            title.className = "history-title";
            title.textContent = chat.title || "New Chat";
            title.onclick = () => openChat(chat.id);

            const actions = document.createElement("div");
            actions.className = "history-actions";

            const renameBtn = document.createElement("button");
            renameBtn.textContent = "✎";
            renameBtn.onclick = () => renameChat(chat.id);

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "×";
            deleteBtn.onclick = () => deleteChat(chat.id);

            actions.append(renameBtn, deleteBtn);
            item.append(title, actions);
            history.appendChild(item);
        });
    } catch (error) {
        console.error("History Error:", error);
    }
}

async function openChat(chatId) {
    const response = await fetch("/chats/" + encodeURIComponent(chatId));
    const chat = await response.json();
    activeChatId = chat.id;
    messages.innerHTML = "";

    if (!chat.messages || !chat.messages.length) {
        showWelcome();
    } else {
        chat.messages.forEach(msg => {
            addMessage(msg.content, msg.role === "user" ? "user" : "ai");
        });
    }
    await loadChatHistory();
}

async function renameChat(chatId) {
    const newTitle = prompt("Enter new chat name:");
    if (!newTitle) return;
    await fetch("/chats/" + encodeURIComponent(chatId) + "/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: newTitle.trim() })
    });
    await loadChatHistory();
}

async function deleteChat(chatId) {
    if (!confirm("Delete this chat?")) return;
    await fetch("/chats/" + encodeURIComponent(chatId), { method: "DELETE" });
    if (activeChatId === chatId) {
        activeChatId = null;
        messages.innerHTML = "";
        showWelcome();
    }
    await loadChatHistory();
}

async function teachAI() {
    const question = prompt("যে প্রশ্নটি AI-কে শেখাতে চাও:");
    if (!question) return;
    const answer = prompt("উত্তর কী হবে?");
    if (!answer) return;

    await fetch("/learn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, answer })
    });
    alert("AI সফলভাবে শিখেছে!");
}

window.addEventListener("DOMContentLoaded", loadChatHistory);
</script>

</body>
</html>
